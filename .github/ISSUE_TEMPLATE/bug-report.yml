name: 🐛 Баг-репорт
description: Сообщить о проблеме или ошибке
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
    - soorq
type: bug
body:
    - type: markdown
      attributes:
          value: |
              ## 🐛 Сообщение об ошибке

              Спасибо, что помогаете нам стать лучше! Пожалуйста, заполните форму максимально подробно.

    - type: checkboxes
      id: checklist
      attributes:
          label: ✅ Перед созданием
          description: Проверьте, что вы сделали всё необходимое
          options:
              - label: Я проверил, что подобная проблема не описана в других issue
                required: true
              - label: Я использую последнюю версию
                required: true
              - label: Я могу воспроизвести проблему
                required: true

    - type: input
      id: version
      attributes:
          label: 📦 Версия
          description: В какой версии вы обнаружили проблему?
          placeholder: v1.2.3
      validations:
          required: true

    - type: dropdown
      id: environment
      attributes:
          label: 🌍 Окружение
          description: Где вы обнаружили проблему?
          options:
              - Локальная разработка
              - Staging
              - Production
              - Docker
              - CI/CD
      validations:
          required: true

    - type: textarea
      id: description
      attributes:
          label: 📝 Описание проблемы
          description: Опишите проблему как можно подробнее
          placeholder: |
              Когда я пытаюсь сделать X, происходит Y...
              Ожидаемое поведение: Z
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: 🔄 Шаги для воспроизведения
          description: Пошаговая инструкция, как воспроизвести проблему
          placeholder: |
              1. Зайдите на страницу...
              2. Нажмите на кнопку...
              3. Видите ошибку...
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: ✅ Ожидаемое поведение
          description: Что должно было произойти?

    - type: textarea
      id: actual
      attributes:
          label: ❌ Фактическое поведение
          description: Что произошло на самом деле?
      validations:
          required: true

    - type: textarea
      id: logs
      attributes:
          label: 📋 Логи и ошибки
          description: Вставьте текст ошибки или логи
          render: shell

    - type: textarea
      id: screenshots
      attributes:
          label: 📸 Скриншоты
          description: Приложите скриншоты или записи экрана (можно перетащить файлы сюда)

    - type: input
      id: browser
      attributes:
          label: 🌐 Браузер
          description: Если проблема в UI, укажите браузер и версию
          placeholder: Chrome 120, Firefox 121...

    - type: input
      id: os
      attributes:
          label: 💻 Операционная система
          placeholder: macOS Sonoma 14.2, Ubuntu 22.04...

    - type: textarea
      id: workaround
      attributes:
          label: 🛠 Обходное решение
          description: Есть ли временное решение?

    - type: textarea
      id: additional
      attributes:
          label: 📎 Дополнительная информация
          description: Любая другая информация, которая может помочь

    - type: markdown
      attributes:
          value: |
              ---
              Спасибо за обратную связь! 🚀