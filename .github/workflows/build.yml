name: "Docker Build and Push"

on:
    workflow_call:
        inputs:
            context:
                description: "Build context path"
                required: false
                default: "."
                type: string
            dockerfile:
                description: "Dockerfile path"
                required: false
                default: "./Dockerfile"
                type: string
            registry:
                description: "Container registry (ghcr.io/docker.io/...)"
                required: false
                default: "ghcr.io"
                type: string

            image-name:
                description: "Image name (without registry)"
                required: true
                type: string
            extra-tags:
                description: "Extra tags (comma-separated)"
                required: false
                default: ""
                type: string
            tag-latest:
                description: "Tag as latest on master branch"
                required: false
                default: true
                type: boolean
            tag-sha:
                description: "Tag with commit SHA"
                required: false
                default: true
                type: boolean
            tag-branch:
                description: "Tag with branch name"
                required: false
                default: true
                type: boolean

            build-args:
                description: "Build args (JSON object)"
                required: false
                default: "{}"
                type: string
            platforms:
                description: "Target platforms (linux/amd64,linux/arm64)"
                required: false
                default: "linux/amd64"
                type: string
            cache-from:
                description: "Cache sources"
                required: false
                default: "type=gha"
                type: string
            cache-to:
                description: "Cache destinations"
                required: false
                default: "type=gha,mode=max"
                type: string
            push:
                description: "Push image to registry"
                required: false
                default: true
                type: boolean

            push-on-branches:
                description: "Branches to push on push events (comma-separated)"
                required: false
                default: "master,dev"
                type: string
            push-on-pr:
                description: "Push on PR events"
                required: false
                default: false
                type: boolean

            enable-login:
                description: "Enable registry login"
                required: false
                default: true
                type: boolean
            fail-on-no-push:
                description: "Fail if no push condition met"
                required: false
                default: false
                type: boolean

        secrets:
            github-token:
                description: "GitHub token for registry login"
                required: false
            registry-username:
                description: "Registry username (default: github.actor)"
                required: false
            registry-password:
                description: "Registry password (default: github.token)"
                required: false

permissions:
    contents: read
    packages: write
    pull-requests: write

jobs:
    build-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            tags: ${{ steps.meta.outputs.tags }}
            digest: ${{ steps.build.outputs.digest }}
            pushed: ${{ steps.build.outputs.push }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Container Registry
              if: ${{ inputs.enable-login == 'true' }}
              uses: docker/login-action@v3
              with:
                  registry: ${{ inputs.registry }}
                  username: ${{ secrets.registry-username || github.actor }}
                  password: ${{ secrets.registry-password || secrets.github-token || secrets.GITHUB_TOKEN }}

            - name: Determine push conditions
              id: push-conditions
              run: |
                  IS_PUSH="${{ github.event_name == 'push' }}"
                  IS_PR="${{ github.event_name == 'pull_request' }}"
                  REF_NAME="${{ github.ref_name }}"
                  PUSH_BRANCHES="${{ inputs.push-on-branches }}"

                  SHOULD_PUSH=false

                  if [[ "$IS_PUSH" == "true" ]]; then
                      IFS=',' read -ra BRANCHES <<< "$PUSH_BRANCHES"
                      for branch in "${BRANCHES[@]}"; do
                          if [[ "$REF_NAME" == "$branch" ]]; then
                              SHOULD_PUSH=true
                              break
                          fi
                      done
                  fi

                  if [[ "$IS_PR" == "true" ]] && [[ "${{ inputs.push-on-pr }}" == "true" ]]; then
                      SHOULD_PUSH=true
                  fi

                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "${{ github.event.inputs.force_push }}" == "true" ]]; then
                      SHOULD_PUSH=true
                  fi

                  echo "should_push=$SHOULD_PUSH" >> $GITHUB_OUTPUT
                  echo "is_base_branch=$( [[ "$REF_NAME" == "master" ]] || [[ "$REF_NAME" == "dev" ]] && echo "true" || echo "false" )" >> $GITHUB_OUTPUT

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ inputs.registry }}/${{ inputs.image-name }}
                  tags: |
                      ${{ inputs.tag-branch == 'true' && 'type=ref,event=branch' || '' }}
                      ${{ inputs.tag-sha == 'true' && 'type=sha,format=short' || '' }}
                      ${{ inputs.tag-latest == 'true' && format('type=raw,value=latest,enable={0}', github.ref == 'refs/heads/master') || '' }}
                      ${{ inputs.extra-tags }}
                  labels: |
                      org.opencontainers.image.source=${{ github.repositoryUrl }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

            - name: Build and push
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: ${{ inputs.context }}
                  file: ${{ inputs.dockerfile }}
                  build-args: ${{ inputs.build-args }}
                  push: ${{ inputs.push == 'true' && steps.push-conditions.outputs.should_push == 'true' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: ${{ inputs.platforms }}
                  cache-from: ${{ inputs.cache-from }}
                  cache-to: ${{ inputs.cache-to }}
                  provenance: false
                  sbom: false

            - name: Log build result
              run: |
                  if [[ "${{ steps.push-conditions.outputs.should_push }}" == "true" ]]; then
                      echo "✅ Image pushed: ${{ steps.meta.outputs.tags }}"
                  else
                      echo "ℹ️ Image built but not pushed (conditions not met)"
                  fi

            - name: Fail if no push
              if: ${{ inputs.fail-on-no-push == 'true' && steps.push-conditions.outputs.should_push == 'false' }}
              run: |
                  echo "❌ Push condition not met, but fail-on-no-push is enabled"
                  exit 1

            - name: Test image
              if: ${{ inputs.push == 'true' && steps.push-conditions.outputs.should_push == 'true' }}
              run: |
                  docker run --rm ${{ steps.meta.outputs.tags }} --help || true
